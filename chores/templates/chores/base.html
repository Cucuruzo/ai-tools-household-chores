<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Household Chores{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    #profile-switcher ul { flex-wrap: wrap; }
    #profile-switcher form { margin: 0; }
    #profile-switcher button { margin: 0; padding: 0.25rem 0.75rem; }
    #profile-switcher button.active { font-weight: bold; border: 2px solid var(--pico-contrast); }
  </style>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="container">
    {% include "chores/_profile_switcher.html" %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
